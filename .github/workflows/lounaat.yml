name: Päivitä lounaslistat

on:
  schedule:
    # GitHubin ajastin toimii vain UTC-ajassa, joten molemmat vaihtoehdot
    # ajastetaan ja "aika"-työ päästää läpi vain sen, joka on Suomen aikaa klo 10.
    - cron: '0 7 * * 1-5'   # = 10:00 kesäaikaa (EEST, UTC+3)
    - cron: '0 8 * * 1-5'   # = 10:00 talviaikaa (EET, UTC+2)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  aika:
    runs-on: ubuntu-latest
    outputs:
      aja: ${{ steps.tarkista.outputs.aja }}
    steps:
      - id: tarkista
        env:
          AJASTUS: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Käsin käynnistetty — ajetaan."
            echo "aja=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Valitaan voimassa olevan aikavyöhykkeen mukaan oikea ajastus
          if [ "$(TZ=Europe/Helsinki date +%z)" = "+0300" ]; then
            OIKEA='0 7 * * 1-5'   # kesäaika
          else
            OIKEA='0 8 * * 1-5'   # talviaika
          fi
          if [ "$AJASTUS" = "$OIKEA" ]; then
            echo "Ajastus '$AJASTUS' vastaa Suomen aikaa klo 10 — ajetaan."
            echo "aja=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ajastus '$AJASTUS' on väärä tälle vuodenajalle — ohitetaan."
            echo "aja=false" >> "$GITHUB_OUTPUT"
          fi

  paivita:
    needs: aika
    if: needs.aika.outputs.aja == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Aja scraper
        run: python scraper.py

      - name: Commitoi lounaat.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lounaat.json
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Päivitä lounaat $(date '+%d.%m.%Y')"
            git push
          fi

  julkaise:
    needs: paivita
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
